[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daynight-diffvpr"
version = "0.2.0"
description = "Day/night VPR and task-guided SD1.5 ControlNet-LoRA joint training"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3", "Pillow>=10,<13", "PyYAML>=6,<7",
  "tqdm>=4.66,<5", "torch>=2.1", "torchvision>=0.16"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
salad = ["pytorch-lightning>=2.1,<3", "pytorch-metric-learning>=2.3,<3", "torchmetrics>=1.2,<2", "faiss-cpu>=1.7,<2", "prettytable>=3,<4"]


# Kept out of base environment: no diffusion packages needed for Stage 1.
# To install: pip install -e '.[diffusion,test]'
diffusion = [
  "diffusers==0.32.2", "transformers>=4.44,<4.48",
  "accelerate>=1.0,<1.4", "peft>=0.13,<0.16",
  "safetensors>=0.4.5,<1", "huggingface-hub>=0.25,<0.30",
  "opencv-python-headless>=4.8,<4.12"
]

[tool.setuptools.packages.find]
include = ["daynight_diffvpr*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
